<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Coolbx OS — Testmodus</title>
  <style>
    :root { --bg: #141210; --paper: #faf8f3; --sub: #968e82; --mint: #50ce96; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      font-family: "Inter", "DejaVu Sans", sans-serif; background: var(--bg); color: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--mint);
           margin-bottom: 48px; animation: pulse 1.8s ease-in-out infinite; }
    .mark { font-size: 52px; font-weight: 900; letter-spacing: -0.5px; }
    .mark .accent { color: var(--mint); font-weight: 300; }
    .sub { margin-top: 18px; font-size: 22px; color: var(--sub); }
    .hint { margin-top: 64px; font-size: 15px; color: #6b6256; letter-spacing: 0.3px; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="dot"></div>
  <div class="mark">coolbx <span class="accent">os</span></div>
  <div class="sub">Testmodus — kiosk werkt</div>
  <div class="hint">dev-placeholder (alleen in dev-builds)</div>
</body>
</html>
