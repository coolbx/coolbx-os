# Home-dir voor de kiosk-user moet bestaan en schrijfbaar zijn (anders kan de browser z'n
# crashpad-database niet aanmaken → crash). coolbx-kiosk-start mount hierop een ephemeral tmpfs.
d /var/lib/coolbx-kiosk 0700 coolbx-kiosk coolbx-kiosk -
# Runtime-staat van de actieve kiosk-app (id/naam) voor waybar en hooks.
d /run/coolbx-kiosk 0755 root root -
d /var/lib/coolbx/share/applications 0755 root root -
