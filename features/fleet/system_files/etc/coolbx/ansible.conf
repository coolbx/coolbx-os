# Coolbx OS — config-repo (ADR-0032). Zet ANSIBLE_PULL_URL op de config-repo van de school om de
# periodieke toestelconfig-pull te ACTIVEREN (de installer doet dit). Zolang de waarde "PLACEHOLDER"
# bevat, doet coolbx-ansible-pull niets (no-op) — veilig default.
# Het toestel geeft rol/profiel/kanaal (device.yaml) + serienummer door; de repo bevat local.yml,
# profiles/ en devices.yml. Kanaal 'test' → branch testing, 'stabiel' → main (ANSIBLE_PULL_BRANCH overschrijft).
ANSIBLE_PULL_URL="PLACEHOLDER — bv. https://github.com/coolbx/coolbx-ansible.git"
ANSIBLE_PULL_PLAYBOOK="local.yml"
