# Verborgen lokale beheerder (ADR-0031/0034): uid < 1000 → niet in de GDM-gebruikerslijst
# ("Niet in de lijst?" + naam werkt wel). Wachtwoord komt van de installer/config-repo (vault);
# tot dan is het account vergrendeld. Lid van wheel = sudo.
g coolbx 900
u coolbx 900:900 "Coolbx beheerder" /var/home/coolbx /bin/bash
m coolbx wheel
